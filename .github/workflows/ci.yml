name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build

      - name: Smoke test the packed CLI
        shell: bash
        run: |
          pnpm --filter openmill pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/openmill-*.tgz
          export OPENMILL_HOME="$RUNNER_TEMP/openmill-home"
          openmill --version
          openmill ls
          openmill server status
          openmill server stop
