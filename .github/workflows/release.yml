name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version="v$(node -p "require('./apps/cli/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match apps/cli/package.json ($version)"
            exit 1
          fi

      - run: pnpm check

      - run: pnpm build

      # pnpm pack rewrites workspace: and catalog: versions. npm publish then uses trusted publishing.
      - run: pnpm --filter openmill pack --pack-destination "$RUNNER_TEMP"

      - run: npm publish "$RUNNER_TEMP"/openmill-*.tgz --access public
